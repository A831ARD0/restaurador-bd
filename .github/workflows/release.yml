name: Compilar y publicar

# Publica una version nueva al crear una etiqueta (git tag v1.2.0 && git push --tags).
# Tambien se puede lanzar a mano desde la pestana Actions para probar la compilacion.
#
# Las acciones van ancladas por SHA, no por etiqueta: una etiqueta se puede
# reapuntar a otro commit, un SHA no.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: macOS (.dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compilar la app
        run: |
          pyinstaller --noconfirm --clean --windowed \
            --name "Restaurador de BD" \
            --osx-bundle-identifier io.github.a831ard0.restauradorbd \
            --icon recursos/icono.icns \
            --collect-all webview \
            --hidden-import pymysql \
            restaurador_bd.py

      # Se sube la app sin empaquetar para que el job de firma pueda trabajarla;
      # el DMG final lo arma quien corresponda (firmado o no).
      - name: Empaquetar la app para el siguiente paso
        run: ditto -c -k --keepParent "dist/Restaurador de BD.app" app-sin-firmar.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: macos-app
          path: app-sin-firmar.zip

  firmar:
    name: Firmar y notarizar (macOS)
    needs: macos
    # Solo corre si la variable del repositorio lo pide. Al usar un entorno
    # protegido, GitHub espera tu aprobacion antes de dar acceso a los secretos.
    if: vars.FIRMAR_MACOS == 'true'
    runs-on: macos-latest
    environment: firma-macos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: macos-app

      - name: Desempaquetar la app
        run: |
          mkdir -p dist
          ditto -x -k app-sin-firmar.zip dist/

      - name: Firmar, empaquetar y notarizar
        env:
          CERT_P12: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          set -e
          LLAVERO=$RUNNER_TEMP/firma.keychain-db
          CLAVE=$(uuidgen)
          security create-keychain -p "$CLAVE" "$LLAVERO"
          security set-keychain-settings -lut 21600 "$LLAVERO"
          security unlock-keychain -p "$CLAVE" "$LLAVERO"
          echo "$CERT_P12" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -k "$LLAVERO" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f $RUNNER_TEMP/cert.p12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$CLAVE" "$LLAVERO" >/dev/null
          security list-keychain -d user -s "$LLAVERO" login.keychain-db

          IDENTIDAD=$(security find-identity -v -p codesigning "$LLAVERO" |
                      grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)"/\1/')
          echo "Firmando con: $IDENTIDAD"
          codesign --force --deep --timestamp --options runtime \
            --keychain "$LLAVERO" --sign "$IDENTIDAD" "dist/Restaurador de BD.app"
          codesign --verify --strict "dist/Restaurador de BD.app"

          xcrun notarytool store-credentials notarytool --keychain "$LLAVERO" \
            --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD"

          # Primero la app: su ticket tiene que viajar dentro del DMG para que
          # Gatekeeper la acepte aunque el equipo no tenga internet.
          ditto -c -k --keepParent "dist/Restaurador de BD.app" app.zip
          xcrun notarytool submit app.zip --keychain-profile notarytool --keychain "$LLAVERO" --wait
          xcrun stapler staple "dist/Restaurador de BD.app"
          rm -f app.zip

          rm -rf dist/dmg && mkdir -p dist/dmg
          cp -R "dist/Restaurador de BD.app" dist/dmg/
          ln -s /Applications "dist/dmg/Aplicaciones"
          hdiutil create -volname "Restaurador de BD" -srcfolder dist/dmg -ov -format UDZO \
            "Restaurador-de-BD-macOS.dmg" >/dev/null
          codesign --force --timestamp --keychain "$LLAVERO" --sign "$IDENTIDAD" \
            "Restaurador-de-BD-macOS.dmg"

          xcrun notarytool submit "Restaurador-de-BD-macOS.dmg" \
            --keychain-profile notarytool --keychain "$LLAVERO" --wait
          xcrun stapler staple "Restaurador-de-BD-macOS.dmg"
          xcrun stapler validate "dist/Restaurador de BD.app"
          spctl -a -vvv -t install "Restaurador-de-BD-macOS.dmg"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: macos-dmg
          path: Restaurador-de-BD-macOS.dmg

  dmg-sin-firmar:
    name: Armar DMG sin firmar
    needs: macos
    if: vars.FIRMAR_MACOS != 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: macos-app

      - name: Armar el DMG
        run: |
          mkdir -p dist/dmg
          ditto -x -k app-sin-firmar.zip dist/dmg/
          ln -s /Applications "dist/dmg/Aplicaciones"
          cp recursos/aviso-gatekeeper.txt "dist/dmg/LEEME - si macOS no la deja abrir.txt"
          hdiutil create -volname "Restaurador de BD" -srcfolder dist/dmg -ov -format UDZO \
            "Restaurador-de-BD-macOS.dmg" >/dev/null

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: macos-dmg
          path: Restaurador-de-BD-macOS.dmg

  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compilar el ejecutable
        run: |
          pyinstaller --noconfirm --clean --windowed --onefile `
            --name "Restaurador de BD" `
            --icon recursos/icono.ico `
            --collect-all webview `
            --hidden-import pymysql `
            restaurador_bd.py
          Copy-Item "dist/Restaurador de BD.exe" "Restaurador-de-BD-Windows.exe"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: windows
          path: Restaurador-de-BD-Windows.exe

  publicar:
    name: Publicar en Releases
    needs: [windows, firmar, dmg-sin-firmar]
    # always() para que no lo frene el job de macOS que se haya saltado
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          path: binarios

      - name: Subir al release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          ls -R binarios
          gh release create "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" \
            --title "${GITHUB_REF_NAME}" --generate-notes || true
          gh release upload "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" --clobber \
            "binarios/macos-dmg/Restaurador-de-BD-macOS.dmg" \
            "binarios/windows/Restaurador-de-BD-Windows.exe"
